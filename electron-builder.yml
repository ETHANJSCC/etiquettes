appId: fr.wienerberger.etiquettes
productName: Etiquettes Inventaire
copyright: Copyright © 2026 Wienerberger France

directories:
  buildResources: build
  output: release

# Fichiers embarques dans l'application packagee (uniquement le build de prod).
files:
  - out/**/*
  - package.json

# --- Cible Windows : installeur NSIS + version portable, en une seule commande ---
win:
  icon: build/icon.ico
  # Ne PAS signer l'executable : evite le telechargement de winCodeSign
  # (et donc l'erreur de liens symboliques qui exigeait des droits admin).
  # L'icone et les metadonnees restent appliquees via resedit (JavaScript pur).
  signExecutable: false
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

# Installeur NSIS « ultra simple » : un clic, sans droits administrateur.
nsis:
  oneClick: true # installation immediate, sans assistant
  perMachine: false # installation par utilisateur -> aucun droit admin requis
  allowElevation: false # ne jamais demander d'elevation
  createDesktopShortcut: true
  createStartMenuShortcut: true
  runAfterFinish: true # lance l'application a la fin de l'installation
  shortcutName: Etiquettes Inventaire
  artifactName: ${productName}-${version}-Installeur.${ext}

# Version portable (un seul .exe, sans installation).
portable:
  artifactName: ${productName}-${version}-Portable.${ext}

# Le projet n'utilise aucun module natif : pas de recompilation.
npmRebuild: false
