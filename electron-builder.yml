appId: fr.wienerberger.etiquettes
productName: Etiquettes Inventaire
copyright: Copyright © 2026 Wienerberger France

directories:
  buildResources: build
  output: release

# Fichiers embarques dans l'application packagee.
files:
  - out/**/*
  - package.json

# Cible Windows : un unique .exe portable, sans installation.
win:
  target:
    - target: portable
      arch:
        - x64
  artifactName: ${productName}-${version}.${ext}

# Options de la version portable (un seul executable auto-extractible).
#
# IMPORTANT : ne PAS fixer `unpackDirName` a un nom constant. Un dossier
# d'extraction fixe et reutilise entre lancements peut rester a moitie
# extrait si l'utilisateur double-clique une seconde fois pendant que
# l'extraction est en cours (ou si un antivirus interfere) : tous les
# lancements suivants reutilisent alors ce dossier corrompu et echouent
# avec des erreurs du type "ffmpeg.dll introuvable". En laissant
# electron-builder generer un nom de dossier base sur le contenu/version,
# chaque nouvelle build repart d'une extraction saine.
portable:
  artifactName: ${productName}-${version}.${ext}
  requestExecutionLevel: user

# Empeche electron-builder d'essayer de reconstruire des modules natifs
# (le projet n'en utilise aucun).
npmRebuild: false
