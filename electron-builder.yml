appId: fr.wienerberger.etiquettes
productName: Etiquettes Inventaire
copyright: Copyright © 2026 Wienerberger France

directories:
  buildResources: build
  output: release

# Fichiers embarques dans l'application packagee.
files:
  - out/**/*
  - package.json

# Cible Windows : un unique .exe portable, sans installation.
win:
  target:
    - target: portable
      arch:
        - x64
  artifactName: ${productName}-${version}.${ext}

# Options de la version portable (un seul executable auto-extractible).
portable:
  # Nom du fichier final : "Etiquettes Inventaire-1.0.0.exe".
  artifactName: ${productName}-${version}.${ext}
  # Extraction dans un dossier fixe (evite de re-extraire a chaque lancement).
  unpackDirName: EtiquettesInventaire
  requestExecutionLevel: user

# Empeche electron-builder d'essayer de reconstruire des modules natifs
# (le projet n'en utilise aucun).
npmRebuild: false
